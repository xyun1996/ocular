name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci
      - run: npm run check

      - name: Verify npm package contents
        run: |
          npm pack --dry-run --json > pack.json
          node - <<'NODE'
          const fs = require('node:fs');
          const pack = JSON.parse(fs.readFileSync('pack.json', 'utf8'))[0];
          const files = new Set(pack.files.map((file) => file.path));
          const required = ['dist/index.js', 'README.md', 'LICENSE', '.env.example'];
          const missing = required.filter((file) => !files.has(file));
          if (missing.length) {
            throw new Error(`npm package is missing required files: ${missing.join(', ')}`);
          }
          console.log(`npm package contains ${pack.files.length} files (${pack.size} bytes)`);
          NODE

      - name: Verify packed CLI entrypoint
        run: |
          npm pack --json > packed.json
          TARBALL="$(node -e "const p=require('./packed.json')[0]; process.stdout.write(p.filename)")"
          TMP_DIR="$(mktemp -d)"
          cd "$TMP_DIR"
          npm init -y >/dev/null 2>&1
          npm install --ignore-scripts "$GITHUB_WORKSPACE/$TARBALL" >/dev/null

          set +e
          ./node_modules/.bin/ocular >stdout.log 2>stderr.log
          STATUS=$?
          set -e

          if [ "$STATUS" -eq 0 ]; then
            echo "Expected ocular to exit because provider configuration is intentionally absent"
            exit 1
          fi

          if ! grep -q "OCULAR_BASE_URL is missing" stderr.log; then
            echo "Packed CLI did not reach ocular configuration validation"
            cat stderr.log
            exit 1
          fi

          echo "Packed ocular CLI executable started successfully and reached configuration validation"
