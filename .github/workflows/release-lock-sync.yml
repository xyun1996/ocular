name: Release lockfile sync

on:
  push:
    branches: [release/v0.1.0]
    paths:
      - package.json
      - .github/workflows/release-lock-sync.yml

permissions:
  contents: write

jobs:
  sync-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v0.1.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm install --package-lock-only --ignore-scripts

      - name: Commit updated package-lock.json
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "release: sync package lock metadata"
          git push origin HEAD:release/v0.1.0
