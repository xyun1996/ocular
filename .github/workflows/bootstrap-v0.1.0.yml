name: Bootstrap v0.1.0

on:
  push:
    branches: [release/bootstrap-v0.1.0]

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: v0.1.0
      RELEASE_TARGET: df3e78bef38c2cf3239107ef99b2ac1bdc59b362
      MCP_SERVER_NAME: io.github.xyun1996/ocular
    steps:
      - name: Checkout exact release target
        uses: actions/checkout@v4
        with:
          ref: df3e78bef38c2cf3239107ef99b2ac1bdc59b362
          fetch-depth: 0

      - name: Verify public npm artifact
        run: |
          version="$(npm view ocular-mcp@0.1.0 version --registry=https://registry.npmjs.org/)"
          test "$version" = "0.1.0"
          echo "verified ocular-mcp@${version} on the public npm registry"

      - name: Install MCP Registry publisher
        run: |
          curl --fail --location \
            "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" \
            | tar xz mcp-publisher
          ./mcp-publisher --help

      - name: Check existing MCP Registry entry
        id: registry
        run: |
          curl --fail --silent --show-error \
            "https://registry.modelcontextprotocol.io/v0.1/servers?search=${MCP_SERVER_NAME}" \
            > registry-before.json
          cat registry-before.json
          if grep -Fq "$MCP_SERVER_NAME" registry-before.json; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Authenticate to MCP Registry with GitHub OIDC
        if: steps.registry.outputs.already_published != 'true'
        run: ./mcp-publisher login github-oidc

      - name: Publish server metadata to MCP Registry
        if: steps.registry.outputs.already_published != 'true'
        run: ./mcp-publisher publish

      - name: Verify MCP Registry publication
        run: |
          for attempt in $(seq 1 12); do
            curl --fail --silent --show-error \
              "https://registry.modelcontextprotocol.io/v0.1/servers?search=${MCP_SERVER_NAME}" \
              > registry-after.json
            if grep -Fq "$MCP_SERVER_NAME" registry-after.json && grep -Fq '0.1.0' registry-after.json; then
              cat registry-after.json
              echo "verified ${MCP_SERVER_NAME} v0.1.0 in the official MCP Registry"
              exit 0
            fi
            echo "waiting for MCP Registry visibility (attempt ${attempt}/12)..."
            sleep 5
          done
          cat registry-after.json || true
          echo "MCP Registry entry did not become visible in time"
          exit 1

      - name: Create GitHub v0.1.0 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$RELEASE_TAG already has a GitHub Release; leaving it unchanged"
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$RELEASE_TARGET" \
              --title "ocular v0.1.0" \
              --notes-file docs/releases/v0.1.0.md
          fi
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json tagName,name,url,isDraft,isPrerelease,targetCommitish
